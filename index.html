<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>계층형 작은 습관 트래커</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 0.5rem;
        }

        .calendar-day {
            cursor: pointer;
            position: relative;
        }

        .calendar-day:hover:not(.empty) .day-box {
            background-color: #e2e8f0;
        }

        .calendar-day.selected .day-box {
            background-color: #3b82f6;
            border-color: #3b82f6;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
        }

        .calendar-day.today .day-box {
            border: 2px solid #3b82f6;
        }

        /* 퍼센트별 도장 공통 스타일 */
        .stamp-base {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            border-radius: 50%;
            width: 3.2rem;
            height: 3.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 900;
            text-align: center;
            line-height: 1.1;
            pointer-events: none;
            z-index: 20;
            background-color: rgba(255, 255, 255, 0.4);
            animation: stampAnimation 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes stampAnimation {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) rotate(-20deg) scale(1); opacity: 1; }
        }

        /* 퍼센트별 도장 개별 색상 */
        .stamp-100 { color: rgba(239, 68, 68, 0.9); border: 3px double rgba(239, 68, 68, 0.9); }
        .stamp-90  { color: rgba(249, 115, 22, 0.9); border: 3px double rgba(249, 115, 22, 0.9); }
        .stamp-80  { color: rgba(132, 204, 22, 0.9); border: 3px double rgba(132, 204, 22, 0.9); }
        .stamp-70  { color: rgba(59, 130, 246, 0.9); border: 3px double rgba(59, 130, 246, 0.9); }
        .stamp-60  { color: rgba(168, 85, 247, 0.9); border: 3px double rgba(168, 85, 247, 0.9); }
        .stamp-0   { color: rgba(100, 116, 139, 0.9); border: 3px double rgba(100, 116, 139, 0.9); font-size: 0.55rem; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .checkbox-custom:checked + div {
            background-color: #10b981;
            border-color: #10b981;
        }
        .checkbox-custom:checked + div svg {
            opacity: 1;
        }
        
        input, select {
            appearance: none;
            -webkit-appearance: none;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center md:text-left flex flex-col md:flex-row md:items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight"><i class="fas fa-layer-group text-blue-500 mr-2"></i>계층형 작은 습관 트래커</h1>
                <p class="text-slate-500 mt-2">상위 습관을 달성하고 하위 습관을 이어나가 보세요.</p>
            </div>
            <!-- Header Buttons -->
            <div class="mt-4 md:mt-0 flex flex-wrap items-center justify-center gap-2">
                <button onclick="toggleHabitManager()" id="toggle-manager-btn" class="px-4 py-2 bg-slate-800 text-white rounded-full shadow-sm hover:bg-slate-700 transition flex items-center gap-2 text-sm font-medium">
                    <i id="toggle-manager-icon" class="fas fa-cog"></i>
                    <span id="toggle-manager-text">습관 관리 열기</span>
                </button>
                <div class="px-4 py-2 bg-white rounded-full shadow-sm border border-slate-200 inline-flex items-center gap-2">
                    <i class="far fa-calendar-check text-blue-500"></i>
                    <span id="today-display" class="font-medium text-slate-700"></span>
                </div>
            </div>
        </header>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 transition-all duration-300">
            
            <!-- Left Column: Calendar -->
            <div id="col-calendar" class="lg:col-span-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[720px] transition-all duration-300">
                <div class="flex items-center justify-between mb-6 shrink-0">
                    <h2 class="text-xl font-semibold text-slate-800" id="current-month-year"></h2>
                    <div class="flex gap-2">
                        <button onclick="changeMonth(-1)" class="p-2 rounded-full hover:bg-slate-100 transition text-slate-600">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button onclick="goToToday()" class="px-3 py-1 text-sm rounded-full bg-slate-100 hover:bg-slate-200 transition text-slate-700 font-medium">
                            오늘
                        </button>
                        <button onclick="changeMonth(1)" class="p-2 rounded-full hover:bg-slate-100 transition text-slate-600">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <div class="calendar-grid mb-2 shrink-0">
                    <div class="text-center text-xs font-semibold text-red-400">일</div>
                    <div class="text-center text-xs font-semibold text-slate-500">월</div>
                    <div class="text-center text-xs font-semibold text-slate-500">화</div>
                    <div class="text-center text-xs font-semibold text-slate-500">수</div>
                    <div class="text-center text-xs font-semibold text-slate-500">목</div>
                    <div class="text-center text-xs font-semibold text-slate-500">금</div>
                    <div class="text-center text-xs font-semibold text-blue-400">토</div>
                </div>

                <div id="calendar-days" class="calendar-grid content-start gap-y-4 mb-4 shrink-0"></div>

                <!-- 달력 하단 요약 리스트 -->
                <div id="calendar-bottom-summary" class="flex-1 flex flex-col min-h-0 border-t border-slate-100 pt-4 mt-auto">
                    <!-- JS로 렌더링 됨 -->
                </div>
            </div>

            <!-- Middle Column: Daily Tracking -->
            <div id="col-tracking" class="lg:col-span-6 bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[720px] overflow-hidden transition-all duration-300">
                <div class="p-6 bg-slate-50 border-b border-slate-100 shrink-0">
                    <h2 class="text-xl font-semibold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-tasks text-blue-500"></i>
                        <span id="selected-date-title"></span>
                    </h2>
                    <p class="text-sm text-slate-500 mt-1" id="daily-progress-text">완료율: 0%</p>
                </div>
                
                <div class="p-6 overflow-y-auto flex-1 bg-white" id="daily-habits-container">
                    <div class="flex flex-col items-center justify-center h-full text-slate-400 text-center" id="empty-habits-msg">
                        <i class="fas fa-clipboard-list text-4xl mb-3 opacity-50"></i>
                        <p>등록된 습관이 없습니다.<br>우측 상단의 '습관 관리 열기'를 눌러 새로운 습관을 추가해보세요!</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Habit Settings (기본적으로 숨김 상태) -->
            <div id="col-manager" class="hidden lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex-col h-[720px] transition-all duration-300">
                <div class="flex items-center justify-between mb-6 shrink-0">
                    <h2 class="text-xl font-semibold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-cog text-slate-400"></i>습관 관리
                    </h2>
                    <button onclick="openPeriodicModal()" class="text-sm px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg transition font-medium whitespace-nowrap">
                        <i class="fas fa-list-ul mr-1"></i>주기 습관 모아보기
                    </button>
                </div>
                
                <!-- Add New Habit Form -->
                <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100 shrink-0">
                    <div class="flex flex-col gap-2">
                        <div class="flex gap-2">
                            <select id="new-habit-time" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base bg-white text-slate-700" onchange="checkCustomTime()">
                            </select>
                            <input type="text" id="custom-time-input" placeholder="새로운 시간대" class="hidden flex-1 px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base">
                        </div>
                        
                        <div class="flex gap-2">
                            <select id="new-habit-freq-type" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base bg-white text-slate-700" onchange="checkFreqType()">
                                <option value="daily">매일</option>
                                <option value="days">N일 주기</option>
                                <option value="weeks">N주 주기</option>
                                <option value="months">N개월 주기</option>
                            </select>
                            <input type="number" id="new-habit-freq-value" placeholder="주기(숫자)" min="1" value="1" class="hidden flex-1 px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base">
                        </div>

                        <div id="periodic-date-inputs" class="flex gap-2 mt-1">
                            <div class="flex-1">
                                <label class="block text-[10px] text-slate-500 mb-0.5 ml-1">시작일</label>
                                <input type="date" id="new-habit-start-date" class="w-full px-3 py-1.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white text-slate-700">
                            </div>
                            <div class="flex-1">
                                <label class="block text-[10px] text-slate-500 mb-0.5 ml-1">종료일</label>
                                <input type="date" id="new-habit-end-date" class="w-full px-3 py-1.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white text-slate-700">
                            </div>
                        </div>

                        <div class="flex gap-2 mt-1">
                            <input type="text" id="new-habit-name" placeholder="최상위 습관 이름" class="flex-1 min-w-0 px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-base">
                            <button onclick="addParentHabit()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition text-base font-medium whitespace-nowrap shrink-0">
                                습관 추가
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Managed Habits List -->
                <div class="flex-1 overflow-y-auto pr-2" id="managed-habits-list">
                    <!-- Managed habits will be generated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center z-[70] backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-11/12 max-w-sm shadow-xl border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4">습관 수정</h3>
            
            <label class="block text-xs text-slate-500 mb-1 ml-1">습관 이름</label>
            <input type="text" id="edit-habit-input" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 mb-4 text-base">
            
            <!-- 날짜 수정 영역 -->
            <div id="edit-periodic-dates" class="hidden mb-6">
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="block text-xs text-slate-500 mb-1 ml-1">시작일</label>
                        <input type="date" id="edit-habit-start-date" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm bg-white text-slate-700">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs text-slate-500 mb-1 ml-1">종료일</label>
                        <input type="date" id="edit-habit-end-date" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm bg-white text-slate-700">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-2">
                <button onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition font-medium">취소</button>
                <button onclick="saveEditHabit()" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition font-medium">저장</button>
            </div>
        </div>
    </div>

    <!-- Periodic Habits List Modal -->
    <div id="periodic-modal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center z-[60] backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-11/12 max-w-xl shadow-xl border border-slate-100 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-5 border-b border-slate-100 pb-3">
                <h3 class="text-xl font-bold text-slate-800"><i class="fas fa-calendar-alt text-blue-500 mr-2"></i>주기적 습관 목록</h3>
                <button onclick="closePeriodicModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg transition"><i class="fas fa-times text-lg"></i></button>
            </div>
            <div id="periodic-modal-list" class="overflow-y-auto flex-1 space-y-3 pr-2">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <script>
        let customTimes = JSON.parse(localStorage.getItem('customTimes')) || ['아침', '점심', '저녁', '자기전', '수시'];
        let habits = JSON.parse(localStorage.getItem('habits')) || [];
        let records = JSON.parse(localStorage.getItem('records')) || {};
        
        let currentMonthDate = new Date();
        let selectedDate = new Date(); 
        let editTarget = { id: null, parentId: null };
        let isManagerVisible = false;

        const HABIT_COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#0ea5e9', '#6366f1', '#a855f7', '#ec4899', '#14b8a6', '#f43f5e'];
        const TIME_COLORS = ['text-orange-500 bg-orange-50', 'text-yellow-500 bg-yellow-50', 'text-indigo-500 bg-indigo-50', 'text-purple-500 bg-purple-50', 'text-teal-500 bg-teal-50', 'text-pink-500 bg-pink-50', 'text-blue-500 bg-blue-50'];

        function getTimeColor(timeStr) {
            const index = customTimes.indexOf(timeStr);
            if (index === -1) return 'text-slate-500 bg-slate-100';
            return TIME_COLORS[index % TIME_COLORS.length];
        }

        function formatDateToYYYYMMDD(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDisplayDate(date) {
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
            return date.toLocaleDateString('ko-KR', options);
        }
        
        function parseDateStr(str) {
            const [y, m, d] = str.split('-');
            return new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function saveData() {
            localStorage.setItem('customTimes', JSON.stringify(customTimes));
            localStorage.setItem('habits', JSON.stringify(habits));
            localStorage.setItem('records', JSON.stringify(records));
        }

        function init() {
            document.getElementById('today-display').innerText = formatDisplayDate(new Date());
            document.getElementById('new-habit-start-date').value = formatDateToYYYYMMDD(new Date());
            
            updateTimeSelects();
            checkFreqType(); 
            renderCalendar();
            renderManagedHabits();
            updateDailyView();
        }

        function toggleHabitManager() {
            isManagerVisible = !isManagerVisible;
            
            const colCalendar = document.getElementById('col-calendar');
            const colTracking = document.getElementById('col-tracking');
            const colManager = document.getElementById('col-manager');
            const toggleIcon = document.getElementById('toggle-manager-icon');
            const toggleText = document.getElementById('toggle-manager-text');

            if (isManagerVisible) {
                colCalendar.classList.replace('lg:col-span-6', 'lg:col-span-4');
                colTracking.classList.replace('lg:col-span-6', 'lg:col-span-4');
                colManager.classList.remove('hidden');
                colManager.classList.add('flex');
                
                toggleText.innerText = '습관 관리 닫기';
                toggleIcon.className = 'fas fa-times';
            } else {
                colCalendar.classList.replace('lg:col-span-4', 'lg:col-span-6');
                colTracking.classList.replace('lg:col-span-4', 'lg:col-span-6');
                colManager.classList.add('hidden');
                colManager.classList.remove('flex');
                
                toggleText.innerText = '습관 관리 열기';
                toggleIcon.className = 'fas fa-cog';
            }
        }

        function updateTimeSelects() {
            const select = document.getElementById('new-habit-time');
            select.innerHTML = customTimes.map(t => `<option value="${t}">${t}</option>`).join('');
            select.innerHTML += `<option value="custom">+ 직접 입력</option>`;
        }

        function checkCustomTime() {
            const select = document.getElementById('new-habit-time');
            const input = document.getElementById('custom-time-input');
            if (select.value === 'custom') {
                input.classList.remove('hidden');
                input.focus();
            } else {
                input.classList.add('hidden');
                input.value = '';
            }
        }

        function checkFreqType() {
            const typeSelect = document.getElementById('new-habit-freq-type');
            const valueInput = document.getElementById('new-habit-freq-value');
            
            if (typeSelect.value !== 'daily') {
                valueInput.classList.remove('hidden');
            } else {
                valueInput.classList.add('hidden');
            }
        }

        function isHabitActiveOnDate(habit, dateStr) {
            const target = parseDateStr(dateStr);
            
            if (habit.startDate) {
                const start = parseDateStr(habit.startDate);
                if (target < start) return false;
            }
            
            if (habit.endDate) {
                const end = parseDateStr(habit.endDate);
                if (target > end) return false;
            }

            if (!habit.frequency || habit.frequency.type === 'daily') return true;

            const start = parseDateStr(habit.startDate || formatDateToYYYYMMDD(new Date()));
            const diffTime = target.getTime() - start.getTime();
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

            if (habit.frequency.type === 'days') {
                return diffDays % habit.frequency.value === 0;
            } else if (habit.frequency.type === 'weeks') {
                return diffDays % (habit.frequency.value * 7) === 0;
            } else if (habit.frequency.type === 'months') {
                const monthDiff = (target.getFullYear() - start.getFullYear()) * 12 + (target.getMonth() - start.getMonth());
                if (monthDiff % habit.frequency.value !== 0) return false;
                
                const startDay = start.getDate();
                const targetDay = target.getDate();
                const daysInTargetMonth = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
                
                if (startDay > daysInTargetMonth) {
                    return targetDay === daysInTargetMonth;
                }
                return targetDay === startDay;
            }
            return true;
        }

        function addParentHabit() {
            const nameInput = document.getElementById('new-habit-name');
            const timeSelect = document.getElementById('new-habit-time');
            const customTimeInput = document.getElementById('custom-time-input');
            const freqType = document.getElementById('new-habit-freq-type').value;
            const freqValueInput = document.getElementById('new-habit-freq-value');
            const startDateInput = document.getElementById('new-habit-start-date');
            const endDateInput = document.getElementById('new-habit-end-date');
            
            const name = nameInput.value.trim();
            let time = timeSelect.value;
            let freqValue = parseInt(freqValueInput.value);

            if (time === 'custom') {
                time = customTimeInput.value.trim();
                if (time && !customTimes.includes(time)) {
                    customTimes.push(time);
                    updateTimeSelects();
                }
            }

            if (!name || !time) {
                nameInput.classList.add('border-red-500');
                setTimeout(() => nameInput.classList.remove('border-red-500'), 1000);
                return;
            }

            if (isNaN(freqValue) || freqValue < 1) freqValue = 1;

            let startDate = startDateInput.value || formatDateToYYYYMMDD(new Date());
            let endDate = endDateInput.value || null;

            habits.push({
                id: generateId(),
                name: name,
                time: time,
                isExpanded: true,
                subHabits: [],
                startDate: startDate,
                endDate: endDate,
                frequency: { type: freqType, value: freqValue }
            });
            
            saveData();
            
            nameInput.value = '';
            freqValueInput.value = '1';
            endDateInput.value = '';
            document.getElementById('new-habit-freq-type').value = 'daily';
            checkFreqType();
            
            if(timeSelect.value === 'custom') {
                timeSelect.value = time;
                checkCustomTime();
            }
            
            renderManagedHabits();
            updateDailyView();
            renderCalendar();
        }

        function addSubHabit(parentId) {
            const inputEl = document.getElementById(`new-sub-${parentId}`);
            const name = inputEl ? inputEl.value.trim() : "";

            if (!name) return;

            const parent = habits.find(h => h.id === parentId);
            if (parent) {
                if (!parent.subHabits) parent.subHabits = [];
                parent.subHabits.push({ id: generateId(), name: name });
                parent.isExpanded = true;
                saveData();
                if(inputEl) inputEl.value = '';
                
                renderManagedHabits();
                updateDailyView();
                renderCalendar();
            }
        }

        function deleteHabit(id, isSub, parentId = null) {
            if (isSub && parentId) {
                const parent = habits.find(h => h.id === parentId);
                if (parent) {
                    parent.subHabits = parent.subHabits.filter(s => s.id !== id);
                }
            } else {
                habits = habits.filter(h => h.id !== id);
            }
            
            for (let date in records) {
                records[date] = records[date].filter(recordId => recordId !== id);
                if (records[date].length === 0) delete records[date];
            }
            
            saveData();
            renderManagedHabits();
            updateDailyView();
            renderCalendar();
            if (!document.getElementById('periodic-modal').classList.contains('hidden')) {
                openPeriodicModal();
            }
        }

        function moveSubHabit(parentId, subId, direction) {
            const parent = habits.find(h => h.id === parentId);
            if (!parent || !parent.subHabits) return;
            
            const idx = parent.subHabits.findIndex(s => s.id === subId);
            if (idx === -1) return;
            
            if (direction === 'up' && idx > 0) {
                const temp = parent.subHabits[idx];
                parent.subHabits[idx] = parent.subHabits[idx - 1];
                parent.subHabits[idx - 1] = temp;
            } else if (direction === 'down' && idx < parent.subHabits.length - 1) {
                const temp = parent.subHabits[idx];
                parent.subHabits[idx] = parent.subHabits[idx + 1];
                parent.subHabits[idx + 1] = temp;
            }
            
            saveData();
            renderManagedHabits();
            updateDailyView();
        }

        function openEditModal(id, parentId = null, currentName) {
            editTarget = { id, parentId };
            const nameInput = document.getElementById('edit-habit-input');
            const datesContainer = document.getElementById('edit-periodic-dates');
            const startInput = document.getElementById('edit-habit-start-date');
            const endInput = document.getElementById('edit-habit-end-date');

            nameInput.value = currentName;

            if (!parentId) {
                const parent = habits.find(h => h.id === id);
                if (parent) {
                    datesContainer.classList.remove('hidden');
                    startInput.value = parent.startDate || '';
                    endInput.value = parent.endDate || '';
                } else {
                    datesContainer.classList.add('hidden');
                }
            } else {
                datesContainer.classList.add('hidden');
            }

            document.getElementById('edit-modal').classList.remove('hidden');
            nameInput.focus();
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            editTarget = { id: null, parentId: null };
        }

        function saveEditHabit() {
            const newName = document.getElementById('edit-habit-input').value.trim();
            if (!newName) return;

            if (editTarget.parentId) {
                const parent = habits.find(h => h.id === editTarget.parentId);
                if (parent) {
                    const sub = parent.subHabits.find(s => s.id === editTarget.id);
                    if (sub) sub.name = newName;
                }
            } else {
                const parent = habits.find(h => h.id === editTarget.id);
                if (parent) {
                    parent.name = newName;
                    
                    const newStart = document.getElementById('edit-habit-start-date').value;
                    const newEnd = document.getElementById('edit-habit-end-date').value;
                    parent.startDate = newStart || parent.startDate; 
                    parent.endDate = newEnd || null;
                }
            }

            saveData();
            closeEditModal();
            renderManagedHabits();
            updateDailyView();
            renderCalendar();
            
            if (!document.getElementById('periodic-modal').classList.contains('hidden')) {
                openPeriodicModal();
            }
        }

        function toggleExpand(id) {
            const parent = habits.find(h => h.id === id);
            if (parent) {
                parent.isExpanded = !parent.isExpanded;
                saveData();
                renderManagedHabits();
                updateDailyView();
            }
        }

        function getFreqText(freq) {
            if (!freq || freq.type === 'daily') return '';
            if (freq.type === 'days') return `${freq.value}일 주기`;
            if (freq.type === 'weeks') return `${freq.value}주 주기`;
            if (freq.type === 'months') return `${freq.value}개월 주기`;
            return '';
        }

            const modal = document.getElementById('periodic-modal');
            const listContainer = document.getElementById('periodic-modal-list');
            
            const periodicHabits = habits.filter(h => h.frequency && h.frequency.type !== 'daily');
            
            if (periodicHabits.length === 0) {

                                </div>

                                    <span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded border border-blue-100 font-medium">${freqText}</span>

                            </div>
                            <div class="flex items-center gap-1">

                                    <i class="fas fa-pen"></i>
                                </button>
                                <button onclick="deleteHabit('${habit.id}', false)" class="p-2 text-slate-400 hover:text-red-500 transition rounded">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                    `;

                listContainer.innerHTML = html;

            modal.classList.remove('hidden');
        }

        function closePeriodicModal() {
            document.getElementById('periodic-modal').classList.add('hidden');
        }

        function renderManagedHabits() {

            container.innerHTML = '';

            if (habits.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">등록된 습관이 없습니다.</p>';

            habits.forEach((parent, index) => {

                let html = `
                    <div class="mb-3 bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                        <div class="flex items-center justify-between p-3 bg-slate-50 border-b border-slate-100 group">
                            <div class="flex items-center gap-3 overflow-hidden flex-1 cursor-pointer" onclick="toggleExpand('${parent.id}')">
                                <span class="text-xs font-semibold px-2 py-1 rounded-md ${timeColorClass} whitespace-nowrap relative pl-4 shrink-0">
                                    <span class="absolute left-1.5 top-1/2 -translate-y-1/2 w-1.5 h-1.5 rounded-full" style="background-color: ${barColor}"></span>

                                </span>
                                <span class="text-base font-semibold text-slate-800 truncate" title="${parent.name}">${parent.name}</span>

                            </div>
                            <div class="flex items-center gap-1 transition-opacity pl-2">
                                <button onclick="openEditModal('${parent.id}', null, '${parent.name.replace(/'/g, "\\'")}')" class="p-1.5 text-slate-400 hover:text-blue-500 transition rounded"><i class="fas fa-pen text-sm"></i></button>
                                <button onclick="deleteHabit('${parent.id}', false)" class="p-1.5 text-slate-400 hover:text-red-500 transition rounded"><i class="fas fa-trash-alt text-sm"></i></button>
                            </div>
                        </div>
                        
                        <div class="${parent.isExpanded ? 'block' : 'hidden'} p-3 space-y-2 bg-white">

                if (parent.subHabits) {
                    parent.subHabits.forEach((sub, index) => {

                                    <button onclick="moveSubHabit('${parent.id}', '${sub.id}', 'down')" class="p-1 text-slate-400 hover:text-slate-700 transition" ${index === parent.subHabits.length - 1 ? 'disabled style="opacity:0.2"' : ''}><i class="fas fa-arrow-down text-xs"></i></button>
                                    <button onclick="openEditModal('${sub.id}', '${parent.id}', '${sub.name.replace(/'/g, "\\'")}')" class="p-1 text-slate-400 hover:text-blue-500 transition ml-1"><i class="fas fa-pen text-xs"></i></button>
                                    <button onclick="deleteHabit('${sub.id}', true, '${parent.id}')" class="p-1 text-slate-400 hover:text-red-500 transition"><i class="fas fa-trash-alt text-xs"></i></button>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `
                            <div class="flex flex-row items-center gap-2 mt-2 pl-4 pr-1">
                                <i class="fas fa-level-up-alt rotate-90 text-slate-300 text-xs shrink-0"></i>
                                <input type="text" id="new-sub-${parent.id}" placeholder="하위 습관 추가..." class="flex-1 min-w-0 px-2.5 py-1.5 text-base rounded border border-slate-200 focus:outline-none focus:border-blue-400 bg-slate-50 focus:bg-white transition" onkeypress="if(event.key==='Enter') addSubHabit('${parent.id}')">
                                <button onclick="addSubHabit('${parent.id}')" class="px-3 py-1.5 text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 rounded transition font-medium shrink-0 whitespace-nowrap">추가</button>

                container.innerHTML += html;

        function getTotalHabitCount(dateStr) {
            let count = 0;
            habits.forEach(p => {
                if (isHabitActiveOnDate(p, dateStr)) {
                    count += 1;
                    if(p.subHabits) count += p.subHabits.length;
                }
            });
            return count;
        }

        function calculateOverallProgress(dateStr) {
            const total = getTotalHabitCount(dateStr);
            if (total === 0) return 0;
            const completed = records[dateStr] ? records[dateStr].length : 0;
            return Math.round((completed / total) * 100);
        }

        function changeMonth(delta) {
            currentMonthDate.setMonth(currentMonthDate.getMonth() + delta);
            renderCalendar();
        }

        function goToToday() {
            currentMonthDate = new Date();
            selectedDate = new Date();
            renderCalendar();
            updateDailyView();
        }

        function renderCalendar() {
            const year = currentMonthDate.getFullYear();
            const month = currentMonthDate.getMonth();
            
            document.getElementById('current-month-year').innerText = `${year}년 ${month + 1}월`;
            
            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const todayStr = formatDateToYYYYMMDD(new Date());
            const selectedStr = formatDateToYYYYMMDD(selectedDate);

            const todayEnd = new Date();
            todayEnd.setHours(23, 59, 59, 999);
            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-day empty';
                daysContainer.appendChild(emptyDiv);
            }

            for (let i = 1; i <= lastDay; i++) {
                const dateObj = new Date(year, month, i);
                const dateStr = formatDateToYYYYMMDD(dateObj);
                
                const dayDiv = document.createElement('div');
                dayDiv.className = `calendar-day flex flex-col items-center relative`;
                
                if (dateStr === todayStr) dayDiv.classList.add('today');
                if (dateStr === selectedStr) dayDiv.classList.add('selected');
                
                const dayOfWeek = dateObj.getDay();
                let textClass = "text-slate-700";
                
                if (dateStr === selectedStr) {
                    textClass = "text-white";
                } else {
                    if(dayOfWeek === 0) textClass = "text-red-500";
                    if(dayOfWeek === 6) textClass = "text-blue-500";
                }

                const hasPeriodicHabit = habits.some(h => h.frequency && h.frequency.type !== 'daily' && isHabitActiveOnDate(h, dateStr));
                const dotHtml = hasPeriodicHabit ? `<div class="absolute top-1.5 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-red-500 rounded-full"></div>` : '';

                const overallProgress = calculateOverallProgress(dateStr);
                const totalCount = getTotalHabitCount(dateStr);
                
                let stampHtml = '';
                
                if (totalCount > 0 && (dateObj <= todayEnd || records[dateStr])) {
                    let stampText = '';
                    let stampClass = '';

                    if (overallProgress === 100) {
                        stampText = '참<br>잘했어요';
                        stampClass = 'stamp-100';
                    } else if (overallProgress >= 90) {
                        stampText = '더<br>힘내요';
                        stampClass = 'stamp-90';
                    } else if (overallProgress >= 80) {
                        stampText = '할 수<br>있어';
                        stampClass = 'stamp-80';
                    } else if (overallProgress >= 70) {
                        stampText = '화이팅';
                        stampClass = 'stamp-70';
                    } else if (overallProgress >= 60) {
                        stampText = '괜찮아';
                        stampClass = 'stamp-60';
                    } else {
                        if (overallProgress > 0 || dateObj < todayStart) {
                            stampText = '오늘도<br>애썼어';
                            stampClass = 'stamp-0';
                        }
                    }

                    if (stampText !== '') {
                        stampHtml = `<div class="stamp-base ${stampClass}">${stampText}</div>`;
                    }
                }

                const topHtml = `
                    <div class="day-box w-full aspect-square bg-slate-50 border border-slate-100 rounded-xl flex items-center justify-center transition-all duration-200 relative overflow-hidden">
                        ${dotHtml}
                        <span class="${textClass} text-sm font-medium z-10 ${hasPeriodicHabit ? 'mt-2' : ''}">${i}</span>
                        ${stampHtml}
                    </div>
                `;

                let progressBarsHtml = `<div class="w-full flex flex-col gap-[4px] items-center mt-1.5 px-0.5">`;
                const activeHabitsOnDate = habits.filter(h => isHabitActiveOnDate(h, dateStr));
                const dailyActiveHabitsOnDate = activeHabitsOnDate.filter(h => !h.frequency || h.frequency.type === 'daily');
                
                if (dailyActiveHabitsOnDate.length > 0) {
                    dailyActiveHabitsOnDate.forEach((parent) => {
                        const totalItems = 1 + (parent.subHabits ? parent.subHabits.length : 0);
                        let completedItems = 0;
                        
                        if (records[dateStr]) {
                            if (records[dateStr].includes(parent.id)) completedItems++;
                            if (parent.subHabits) {
                                parent.subHabits.forEach(sub => {
                                    if (records[dateStr].includes(sub.id)) completedItems++;
                                });
                            }
                        }
                        
                        const progress = (completedItems / totalItems) * 100;
                        const pIndex = habits.findIndex(h => h.id === parent.id);
                        const barColor = HABIT_COLORS[pIndex % HABIT_COLORS.length];
                        
                        progressBarsHtml += `
                            <div class="w-full bg-slate-200/60 rounded-full overflow-hidden shrink-0" style="height: 4px;">
                                <div class="h-full transition-all duration-300 rounded-full" style="width: ${progress}%; background-color: ${barColor}"></div>
                            </div>
                        `;
                    });
                }
                progressBarsHtml += `</div>`;

                dayDiv.innerHTML = topHtml + progressBarsHtml;
                dayDiv.onclick = () => {
                    selectedDate = new Date(year, month, i);
                    renderCalendar();
                    updateDailyView();
                };
                daysContainer.appendChild(dayDiv);
            }
        }

        function toggleRecord(id, dateStr) {
            if (!records[dateStr]) records[dateStr] = [];
            const index = records[dateStr].indexOf(id);
            if (index > -1) records[dateStr].splice(index, 1);
            else records[dateStr].push(id);

            if (records[dateStr].length === 0) delete records[dateStr];

            saveData();
            updateDailyView();
            renderCalendar(); 
        }

        function updateDailyView() {
            const dateStr = formatDateToYYYYMMDD(selectedDate);
            document.getElementById('selected-date-title').innerText = formatDisplayDate(selectedDate);
            
            const overallProgress = calculateOverallProgress(dateStr);
            const progressText = document.getElementById('daily-progress-text');
            progressText.innerText = getTotalHabitCount(dateStr) === 0 ? '이날 등록된 습관이 없습니다.' : `오늘의 달성률: ${overallProgress}%`;
            
            const container = document.getElementById('daily-habits-container');
            const emptyMsg = document.getElementById('empty-habits-msg');

            const activeHabits = habits.filter(h => isHabitActiveOnDate(h, dateStr));

            if (activeHabits.length === 0) {
                emptyMsg.style.display = 'flex';
                Array.from(container.children).forEach(child => { if (child.id !== 'empty-habits-msg') child.remove(); });
            } else {
                emptyMsg.style.display = 'none';
                
                const grouped = {};
                activeHabits.forEach(h => {
                    if (!grouped[h.time]) grouped[h.time] = [];
                    grouped[h.time].push(h);
                });

                Array.from(container.children).forEach(child => { if (child.id !== 'empty-habits-msg') child.remove(); });
                const completedIds = records[dateStr] || [];

                const sortedTimes = Object.keys(grouped).sort((a, b) => {
                    let ia = customTimes.indexOf(a);
                    let ib = customTimes.indexOf(b);
                    if(ia === -1) ia = 999; if(ib === -1) ib = 999;
                    return ia - ib;
                });

                sortedTimes.forEach(time => {
                    const section = document.createElement('div');
                    section.className = 'mb-6 last:mb-0';
                    const timeColorClass = getTimeColor(time);

                    let html = `
                        <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-current ${timeColorClass.split(' ')[0]}"></span>
                            ${time}
                        </h3>
                        <div class="space-y-2">
                    `;

                    grouped[time].forEach(parent => {
                        let isNextFound = false;

                        const isParentCompleted = completedIds.includes(parent.id);
                        const bgClass = isParentCompleted ? 'bg-green-50/40 border-green-200' : 'bg-white border-slate-200 shadow-sm';
                        const hasSubs = parent.subHabits && parent.subHabits.length > 0;
                        
                        const pIndex = habits.findIndex(h => h.id === parent.id);
                        const barColor = HABIT_COLORS[pIndex % HABIT_COLORS.length];
                        const freqText = getFreqText(parent.frequency);
                        const freqBadge = freqText ? `<span class="ml-2 text-xs font-normal text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">${freqText}</span>` : '';

                        let textClass = 'text-slate-800 text-lg font-semibold';
                        if (!isParentCompleted && !isNextFound) {
                            textClass = 'text-slate-900 text-xl font-extrabold';
                            isNextFound = true;
                        } else if (isParentCompleted) {
                            textClass = 'text-slate-500 text-lg font-semibold';
                        }

                        html += `
                            <div class="rounded-xl border ${bgClass} transition-all duration-300 overflow-hidden relative">
                                <div class="absolute left-0 top-0 bottom-0 w-1" style="background-color: ${barColor}"></div>
                                
                                <label class="flex items-center p-3 pl-4 cursor-pointer hover:bg-slate-50/50 select-none group">
                                    <div class="relative flex items-center justify-center w-6 h-6 mr-3 shrink-0">
                                        <input type="checkbox" class="checkbox-custom absolute opacity-0 w-full h-full cursor-pointer" 
                                            ${isParentCompleted ? 'checked' : ''} 
                                            onchange="toggleRecord('${parent.id}', '${dateStr}')">
                                        <div class="w-5 h-5 rounded border-2 border-slate-300 flex items-center justify-center transition-colors">
                                            <svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                        </div>
                                    </div>
                                    <div class="flex items-center flex-1 min-w-0">
                                        <span class="${textClass} transition-all duration-300 truncate">${parent.name}</span>
                                        ${freqBadge}
                                    </div>
                                    ${hasSubs ? `<button type="button" onclick="event.preventDefault(); toggleExpand('${parent.id}')" class="p-2 text-slate-400 hover:text-slate-600 focus:outline-none shrink-0"><i class="fas fa-chevron-${parent.isExpanded ? 'up' : 'down'}"></i></button>` : ''}
                                </label>
                        `;

                        if (hasSubs && parent.isExpanded) {
                            html += `<div class="bg-slate-50/50 border-t border-slate-100 py-1 pl-1">`;
                            parent.subHabits.forEach(sub => {
                                const isSubCompleted = completedIds.includes(sub.id);
                                
                                let subTextClass = 'text-slate-700 text-base font-normal';
                                if (!isSubCompleted && !isNextFound) {
                                    subTextClass = 'text-slate-900 text-lg font-bold';
                                    isNextFound = true;
                                } else if (isSubCompleted) {
                                    subTextClass = 'text-slate-400 text-base font-normal';
                                }
                                
                                html += `
                                    <label class="flex items-center p-2.5 pl-12 cursor-pointer hover:bg-slate-100/50 select-none group">
                                        <div class="relative flex items-center justify-center w-5 h-5 mr-3 shrink-0">
                                            <input type="checkbox" class="checkbox-custom absolute opacity-0 w-full h-full cursor-pointer" 
                                                ${isSubCompleted ? 'checked' : ''} 
                                                onchange="toggleRecord('${sub.id}', '${dateStr}')">
                                            <div class="w-4 h-4 rounded-sm border-2 border-slate-300 flex items-center justify-center transition-colors">
                                                <svg class="w-2.5 h-2.5 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                            </div>
                                        </div>
                                        <span class="${subTextClass} flex-1 transition-all duration-300 truncate">${sub.name}</span>
                                    </label>
                                `;
                            });
                            html += `</div>`;
                        }

                        html += `</div>`;
                    });

                    html += `</div>`;
                    section.innerHTML = html;
                    container.appendChild(section);
                });
            }

            // 달력 하단 요약 업데이트 함수 호출
            updateCalendarBottomSummary(dateStr, activeHabits);
        }

        function updateCalendarBottomSummary(dateStr, activeHabits) {
            const container = document.getElementById('calendar-bottom-summary');
            
            if (activeHabits.length === 0) {
                container.innerHTML = '<div class="h-full flex items-center justify-center text-sm text-slate-400">이날 등록된 습관이 없습니다.</div>';
                return;
            }

            let html = `<h3 class="text-sm font-bold text-slate-700 mb-2 shrink-0"><i class="fas fa-list-check mr-2 text-blue-500"></i>습관 요약 리스트</h3>`;
            html += `<div class="overflow-y-auto flex-1 pr-1 flex flex-col gap-1.5 custom-scrollbar pb-2">`;
            
            activeHabits.forEach(habit => {
                const isPeriodic = habit.frequency && habit.frequency.type !== 'daily';
                const pIndex = habits.findIndex(h => h.id === habit.id);
                const barColor = HABIT_COLORS[pIndex % HABIT_COLORS.length];
                
                const badge = isPeriodic 
                    ? `<span class="text-[10px] bg-red-50 text-red-500 px-1.5 py-0.5 rounded border border-red-100 ml-auto whitespace-nowrap">주기적</span>` 
                    : `<span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded border border-slate-200 ml-auto whitespace-nowrap">매일</span>`;
                
                html += `
                    <div class="flex items-center gap-2 px-3 py-2 bg-slate-50 rounded-lg border border-slate-100 shrink-0">
                        <span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${barColor}"></span>
                        <span class="text-sm text-slate-700 font-medium truncate">${habit.name}</span>
                        ${badge}
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        window.onload = init;
    </script>
</body>
</html>
