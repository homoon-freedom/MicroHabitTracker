<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계층형 작은 습관 트래커</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .calendar-day:hover:not(.empty) {
            background-color: #e2e8f0;
        }

        .calendar-day.selected {
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
        }

        .calendar-day.today {
            border: 2px solid #3b82f6;
        }

        .progress-bar {
            position: absolute;
            bottom: 4px;
            left: 10%;
            width: 80%;
            height: 4px;
            border-radius: 2px;
            background-color: #e2e8f0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #10b981;
            transition: width 0.3s ease;
        }
        
        .selected .progress-bar {
            background-color: rgba(255,255,255,0.3);
        }
        .selected .progress-fill {
            background-color: #fff;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .checkbox-custom:checked + div {
            background-color: #10b981;
            border-color: #10b981;
        }
        .checkbox-custom:checked + div svg {
            opacity: 1;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center md:text-left flex flex-col md:flex-row md:items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight"><i class="fas fa-layer-group text-blue-500 mr-2"></i>계층형 작은 습관 트래커</h1>
                <p class="text-slate-500 mt-2">상위 습관을 달성하고 하위 습관을 이어나가 보세요.</p>
            </div>
            <div class="mt-4 md:mt-0 px-4 py-2 bg-white rounded-full shadow-sm border border-slate-200 inline-flex items-center gap-2">
                <i class="far fa-calendar-check text-blue-500"></i>
                <span id="today-display" class="font-medium text-slate-700"></span>
            </div>
        </header>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Column: Calendar (Spans 4 cols on lg) -->
            <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[650px]">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-semibold text-slate-800" id="current-month-year"></h2>
                    <div class="flex gap-2">
                        <button onclick="changeMonth(-1)" class="p-2 rounded-full hover:bg-slate-100 transition text-slate-600">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button onclick="goToToday()" class="px-3 py-1 text-sm rounded-full bg-slate-100 hover:bg-slate-200 transition text-slate-700 font-medium">
                            오늘
                        </button>
                        <button onclick="changeMonth(1)" class="p-2 rounded-full hover:bg-slate-100 transition text-slate-600">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <div class="calendar-grid mb-2">
                    <div class="text-center text-xs font-semibold text-red-400">일</div>
                    <div class="text-center text-xs font-semibold text-slate-500">월</div>
                    <div class="text-center text-xs font-semibold text-slate-500">화</div>
                    <div class="text-center text-xs font-semibold text-slate-500">수</div>
                    <div class="text-center text-xs font-semibold text-slate-500">목</div>
                    <div class="text-center text-xs font-semibold text-slate-500">금</div>
                    <div class="text-center text-xs font-semibold text-blue-400">토</div>
                </div>

                <div id="calendar-days" class="calendar-grid flex-1"></div>
            </div>

            <!-- Middle Column: Daily Tracking (Spans 4 cols on lg) -->
            <div class="lg:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[650px] overflow-hidden">
                <div class="p-6 bg-slate-50 border-b border-slate-100">
                    <h2 class="text-xl font-semibold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-tasks text-blue-500"></i>
                        <span id="selected-date-title"></span>
                    </h2>
                    <p class="text-sm text-slate-500 mt-1" id="daily-progress-text">완료율: 0%</p>
                </div>
                
                <div class="p-6 overflow-y-auto flex-1 bg-white" id="daily-habits-container">
                    <div class="flex flex-col items-center justify-center h-full text-slate-400 text-center" id="empty-habits-msg">
                        <i class="fas fa-clipboard-list text-4xl mb-3 opacity-50"></i>
                        <p>등록된 습관이 없습니다.<br>우측에서 새로운 습관을 추가해보세요!</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Habit Settings (Spans 4 cols on lg) -->
            <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[650px]">
                <h2 class="text-xl font-semibold text-slate-800 mb-6 flex items-center gap-2">
                    <i class="fas fa-cog text-slate-400"></i>전체 습관 목록 (관리용)
                </h2>
                
                <!-- Add New Habit Form -->
                <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <div class="flex flex-col gap-2"> <!-- flex-col로 변경하여 세로 정렬 -->
                        <div class="flex gap-2">
                            <select id="new-habit-time" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white text-slate-700" onchange="checkCustomTime()">
                                <!-- Generated by JS -->
                            </select>
                            <input type="text" id="custom-time-input" placeholder="새로운 시간대" class="hidden flex-1 px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="new-habit-name" placeholder="최상위 습관 이름" class="flex-1 min-w-0 px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            <button onclick="addParentHabit()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition text-sm font-medium whitespace-nowrap shrink-0">
                                습관 추가
                            </button>
                        </div>
                    </div>
                </div>


                <!-- Managed Habits List -->
                <div class="flex-1 overflow-y-auto pr-2" id="managed-habits-list">
                    <!-- Managed habits will be generated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-11/12 max-w-sm shadow-xl border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4">습관 이름 수정</h3>
            <input type="text" id="edit-habit-input" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 mb-6">
            <div class="flex justify-end gap-2">
                <button onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition font-medium">취소</button>
                <button onclick="saveEditHabit()" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition font-medium">저장</button>
            </div>
        </div>
    </div>

    <script>
        // Data Structure
        let customTimes = JSON.parse(localStorage.getItem('customTimes')) || ['아침', '점심', '저녁', '자기전', '수시'];
        
        // habits array of objects: { id, name, time, isExpanded, subHabits: [{id, name}] }
        let habits = JSON.parse(localStorage.getItem('habits')) || [];
        
        // records: { "YYYY-MM-DD": ["habit_id_1", "sub_id_2"] }
        let records = JSON.parse(localStorage.getItem('records')) || {};
        
        // Dates
        let currentMonthDate = new Date();
        let selectedDate = new Date(); 

        // Modal state
        let editTarget = { id: null, parentId: null };

        const TIME_COLORS = ['text-orange-500 bg-orange-50', 'text-yellow-500 bg-yellow-50', 'text-indigo-500 bg-indigo-50', 'text-purple-500 bg-purple-50', 'text-teal-500 bg-teal-50', 'text-pink-500 bg-pink-50', 'text-blue-500 bg-blue-50'];

        function getTimeColor(timeStr) {
            const index = customTimes.indexOf(timeStr);
            if (index === -1) return 'text-slate-500 bg-slate-100';
            return TIME_COLORS[index % TIME_COLORS.length];
        }

        function formatDateToYYYYMMDD(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDisplayDate(date) {
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
            return date.toLocaleDateString('ko-KR', options);
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function saveData() {
            localStorage.setItem('customTimes', JSON.stringify(customTimes));
            localStorage.setItem('habits', JSON.stringify(habits));
            localStorage.setItem('records', JSON.stringify(records));
        }

        function init() {
            document.getElementById('today-display').innerText = formatDisplayDate(new Date());
            updateTimeSelects();
            renderCalendar();
            renderManagedHabits();
            updateDailyView();
        }

        function updateTimeSelects() {
            const select = document.getElementById('new-habit-time');
            select.innerHTML = customTimes.map(t => `<option value="${t}">${t}</option>`).join('');
            select.innerHTML += `<option value="custom">+ 직접 입력</option>`;
        }

        function checkCustomTime() {
            const select = document.getElementById('new-habit-time');
            const input = document.getElementById('custom-time-input');
            if (select.value === 'custom') {
                input.classList.remove('hidden');
                input.focus();
            } else {
                input.classList.add('hidden');
                input.value = '';
            }
        }

        function addParentHabit() {
            const nameInput = document.getElementById('new-habit-name');
            const timeSelect = document.getElementById('new-habit-time');
            const customTimeInput = document.getElementById('custom-time-input');
            
            const name = nameInput.value.trim();
            let time = timeSelect.value;

            if (time === 'custom') {
                time = customTimeInput.value.trim();
                if (time && !customTimes.includes(time)) {
                    customTimes.push(time);
                    updateTimeSelects();
                }
            }

            if (!name || !time) {
                nameInput.classList.add('border-red-500');
                setTimeout(() => nameInput.classList.remove('border-red-500'), 1000);
                return;
            }

            habits.push({
                id: generateId(),
                name: name,
                time: time,
                isExpanded: true,
                subHabits: []
            });
            
            saveData();
            nameInput.value = '';
            if(timeSelect.value === 'custom') {
                timeSelect.value = time;
                checkCustomTime();
            }
            
            renderManagedHabits();
            updateDailyView();
            renderCalendar();
        }

        function addSubHabit(parentId, inputId = null) {
            let name = "";
            let inputEl = null;
            
            if (inputId) {
                inputEl = document.getElementById(inputId);
                name = inputEl.value.trim();
            } else {
                // Management view fallback
                inputEl = document.getElementById(`new-sub-${parentId}`);
                name = inputEl.value.trim();
            }

            if (!name) return;

            const parent = habits.find(h => h.id === parentId);
            if (parent) {
                if (!parent.subHabits) parent.subHabits = [];
                parent.subHabits.push({ id: generateId(), name: name });
                parent.isExpanded = true;
                saveData();
                if(inputEl) inputEl.value = '';
                
                renderManagedHabits();
                updateDailyView();
                renderCalendar();
            }
        }

        function deleteHabit(id, isSub, parentId = null) {
            if (isSub && parentId) {
                const parent = habits.find(h => h.id === parentId);
                if (parent) {
                    parent.subHabits = parent.subHabits.filter(s => s.id !== id);
                }
            } else {
                habits = habits.filter(h => h.id !== id);
            }
            
            // Clean records
            for (let date in records) {
                records[date] = records[date].filter(recordId => recordId !== id);
                if (records[date].length === 0) delete records[date];
            }
            
            saveData();
            renderManagedHabits();
            updateDailyView();
            renderCalendar();
        }

        function moveSubHabit(parentId, subId, direction) {
            const parent = habits.find(h => h.id === parentId);
            if (!parent || !parent.subHabits) return;
            
            const idx = parent.subHabits.findIndex(s => s.id === subId);
            if (idx === -1) return;
            
            if (direction === 'up' && idx > 0) {
                const temp = parent.subHabits[idx];
                parent.subHabits[idx] = parent.subHabits[idx - 1];
                parent.subHabits[idx - 1] = temp;
            } else if (direction === 'down' && idx < parent.subHabits.length - 1) {
                const temp = parent.subHabits[idx];
                parent.subHabits[idx] = parent.subHabits[idx + 1];
                parent.subHabits[idx + 1] = temp;
            }
            
            saveData();
            renderManagedHabits();
            updateDailyView();
        }

        function openEditModal(id, parentId = null, currentName) {
            editTarget = { id, parentId };
            const input = document.getElementById('edit-habit-input');
            input.value = currentName;
            document.getElementById('edit-modal').classList.remove('hidden');
            input.focus();
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            editTarget = { id: null, parentId: null };
        }

        function saveEditHabit() {
            const newName = document.getElementById('edit-habit-input').value.trim();
            if (!newName) return;

            if (editTarget.parentId) {
                // Edit sub habit
                const parent = habits.find(h => h.id === editTarget.parentId);
                if (parent) {
                    const sub = parent.subHabits.find(s => s.id === editTarget.id);
                    if (sub) sub.name = newName;
                }
            } else {
                // Edit parent habit
                const parent = habits.find(h => h.id === editTarget.id);
                if (parent) parent.name = newName;
            }

            saveData();
            closeEditModal();
            renderManagedHabits();
            updateDailyView();
        }

        function toggleExpand(id) {
            const parent = habits.find(h => h.id === id);
            if (parent) {
                parent.isExpanded = !parent.isExpanded;
                saveData();
                renderManagedHabits();
                updateDailyView();
            }
        }

        function renderManagedHabits() {
            const container = document.getElementById('managed-habits-list');
            container.innerHTML = '';

            if (habits.length === 0) {
                container.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">등록된 습관이 없습니다.</p>';
                return;
            }

            habits.forEach(parent => {
                const timeColorClass = getTimeColor(parent.time);
                const hasSubs = parent.subHabits && parent.subHabits.length > 0;
                
                let html = `
                    <div class="mb-3 bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                        <!-- Parent Header -->
                        <div class="flex items-center justify-between p-3 bg-slate-50 border-b border-slate-100 group">
                            <div class="flex items-center gap-3 overflow-hidden flex-1 cursor-pointer" onclick="toggleExpand('${parent.id}')">
                                <span class="text-xs font-semibold px-2 py-1 rounded-md ${timeColorClass} whitespace-nowrap">
                                    ${parent.time}
                                </span>
                                <span class="text-base font-semibold text-slate-800 truncate" title="${parent.name}">${parent.name}</span>
                                ${hasSubs ? `<i class="fas fa-chevron-${parent.isExpanded ? 'up' : 'down'} text-slate-400 text-xs ml-2"></i>` : ''}
                            </div>
                            <div class="flex items-center gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity pl-2">
                                <button onclick="openEditModal('${parent.id}', null, '${parent.name.replace(/'/g, "\\'")}')" class="p-1.5 text-slate-400 hover:text-blue-500 transition rounded"><i class="fas fa-pen text-sm"></i></button>
                                <button onclick="deleteHabit('${parent.id}', false)" class="p-1.5 text-slate-400 hover:text-red-500 transition rounded"><i class="fas fa-trash-alt text-sm"></i></button>
                            </div>
                        </div>
                        
                        <!-- Sub Habits Area -->
                        <div class="${parent.isExpanded ? 'block' : 'hidden'} p-3 space-y-2 bg-white">
                `;

                if (parent.subHabits) {
                    parent.subHabits.forEach((sub, index) => {
                        html += `
                            <div class="flex items-center justify-between pl-4 py-1.5 group border-b border-slate-50 last:border-0">
                                <div class="flex items-center gap-2 flex-1 overflow-hidden">
                                    <i class="fas fa-level-up-alt rotate-90 text-slate-300 text-xs"></i>
                                    <span class="text-[15px] text-slate-700 truncate" title="${sub.name}">${sub.name}</span>
                                    <span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded ml-1">Sub</span>
                                </div>
                                <div class="flex items-center gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="moveSubHabit('${parent.id}', '${sub.id}', 'up')" class="p-1 text-slate-400 hover:text-slate-700 transition" ${index === 0 ? 'disabled style="opacity:0.2"' : ''}><i class="fas fa-arrow-up text-xs"></i></button>
                                    <button onclick="moveSubHabit('${parent.id}', '${sub.id}', 'down')" class="p-1 text-slate-400 hover:text-slate-700 transition" ${index === parent.subHabits.length - 1 ? 'disabled style="opacity:0.2"' : ''}><i class="fas fa-arrow-down text-xs"></i></button>
                                    <button onclick="openEditModal('${sub.id}', '${parent.id}', '${sub.name.replace(/'/g, "\\'")}')" class="p-1 text-slate-400 hover:text-blue-500 transition ml-2"><i class="fas fa-pen text-xs"></i></button>
                                    <button onclick="deleteHabit('${sub.id}', true, '${parent.id}')" class="p-1 text-slate-400 hover:text-red-500 transition"><i class="fas fa-trash-alt text-xs"></i></button>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `
                            <div class="flex items-center gap-2 mt-2 pl-4">
                                <i class="fas fa-level-up-alt rotate-90 text-slate-300 text-xs"></i>
                                <input type="text" id="new-sub-${parent.id}" placeholder="하위 습관 추가..." class="flex-1 px-2 py-1.5 text-sm rounded border border-slate-200 focus:outline-none focus:border-blue-400 bg-slate-50 focus:bg-white transition" onkeypress="if(event.key==='Enter') addSubHabit('${parent.id}')">
                                <button onclick="addSubHabit('${parent.id}')" class="px-2 py-1.5 text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 rounded transition whitespace-nowrap">추가</button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function getTotalHabitCount() {
            let count = 0;
            habits.forEach(p => {
                count += 1;
                if(p.subHabits) count += p.subHabits.length;
            });
            return count;
        }

        function calculateProgress(dateStr) {
            const total = getTotalHabitCount();
            if (total === 0) return 0;
            const completed = records[dateStr] ? records[dateStr].length : 0;
            return Math.round((completed / total) * 100);
        }

        function changeMonth(delta) {
            currentMonthDate.setMonth(currentMonthDate.getMonth() + delta);
            renderCalendar();
        }

        function goToToday() {
            currentMonthDate = new Date();
            selectedDate = new Date();
            renderCalendar();
            updateDailyView();
        }

        function renderCalendar() {
            const year = currentMonthDate.getFullYear();
            const month = currentMonthDate.getMonth();
            
            document.getElementById('current-month-year').innerText = `${year}년 ${month + 1}월`;
            
            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const todayStr = formatDateToYYYYMMDD(new Date());
            const selectedStr = formatDateToYYYYMMDD(selectedDate);

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-day empty';
                daysContainer.appendChild(emptyDiv);
            }

            for (let i = 1; i <= lastDay; i++) {
                const dateObj = new Date(year, month, i);
                const dateStr = formatDateToYYYYMMDD(dateObj);
                const progress = calculateProgress(dateStr);
                
                const dayDiv = document.createElement('div');
                dayDiv.className = `calendar-day text-sm bg-slate-50 border border-slate-100/50`;
                
                if (dateStr === todayStr) dayDiv.classList.add('today');
                if (dateStr === selectedStr) dayDiv.classList.add('selected');
                
                const dayOfWeek = dateObj.getDay();
                let textClass = "text-slate-700";
                if(dayDiv.classList.contains('selected')) textClass = "text-white";
                else {
                    if(dayOfWeek === 0) textClass = "text-red-500";
                    if(dayOfWeek === 6) textClass = "text-blue-500";
                }

                let progressBarHtml = '';
                if (getTotalHabitCount() > 0) {
                    let fillColor = progress === 100 ? '#10b981' : (progress > 0 ? '#3b82f6' : 'transparent');
                    if (dayDiv.classList.contains('selected') && progress > 0) fillColor = '#ffffff';
                    
                    progressBarHtml = `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%; background-color: ${fillColor}"></div>
                        </div>
                    `;
                }

                dayDiv.innerHTML = `<span class="${textClass} font-medium relative z-10">${i}</span>${progressBarHtml}`;
                dayDiv.onclick = () => {
                    selectedDate = new Date(year, month, i);
                    renderCalendar();
                    updateDailyView();
                };
                daysContainer.appendChild(dayDiv);
            }
        }

        function toggleRecord(id, dateStr) {
            if (!records[dateStr]) records[dateStr] = [];
            const index = records[dateStr].indexOf(id);
            if (index > -1) records[dateStr].splice(index, 1);
            else records[dateStr].push(id);

            if (records[dateStr].length === 0) delete records[dateStr];

            saveData();
            updateDailyView();
            renderCalendar(); 
        }

        function updateDailyView() {
            const dateStr = formatDateToYYYYMMDD(selectedDate);
            document.getElementById('selected-date-title').innerText = formatDisplayDate(selectedDate);
            
            const progress = calculateProgress(dateStr);
            const progressText = document.getElementById('daily-progress-text');
            progressText.innerText = getTotalHabitCount() === 0 ? '등록된 습관이 없습니다.' : `오늘의 달성률: ${progress}%`;
            
            const container = document.getElementById('daily-habits-container');
            const emptyMsg = document.getElementById('empty-habits-msg');

            if (habits.length === 0) {
                emptyMsg.style.display = 'flex';
                Array.from(container.children).forEach(child => { if (child.id !== 'empty-habits-msg') child.remove(); });
                return;
            }

            emptyMsg.style.display = 'none';

            // Group by Time
            const grouped = {};
            habits.forEach(h => {
                if (!grouped[h.time]) grouped[h.time] = [];
                grouped[h.time].push(h);
            });

            Array.from(container.children).forEach(child => { if (child.id !== 'empty-habits-msg') child.remove(); });
            const completedIds = records[dateStr] || [];

            // Sort times based on customTimes array order
            const sortedTimes = Object.keys(grouped).sort((a, b) => {
                let ia = customTimes.indexOf(a);
                let ib = customTimes.indexOf(b);
                if(ia === -1) ia = 999; if(ib === -1) ib = 999;
                return ia - ib;
            });

            sortedTimes.forEach(time => {
                const section = document.createElement('div');
                section.className = 'mb-6 last:mb-0';
                const timeColorClass = getTimeColor(time);

                let html = `
                    <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-current ${timeColorClass.split(' ')[0]}"></span>
                        ${time}
                    </h3>
                    <div class="space-y-2">
                `;

                grouped[time].forEach(parent => {
                    const isParentCompleted = completedIds.includes(parent.id);
                    const bgClass = isParentCompleted ? 'bg-green-50/40 border-green-200' : 'bg-white border-slate-200 shadow-sm';
                    const textClass = isParentCompleted ? 'text-slate-400 line-through' : 'text-slate-800';
                    const hasSubs = parent.subHabits && parent.subHabits.length > 0;

                    html += `
                        <div class="rounded-xl border ${bgClass} transition-all duration-300 overflow-hidden">
                            <label class="flex items-center p-3 cursor-pointer hover:bg-slate-50/50 select-none group">
                                <div class="relative flex items-center justify-center w-6 h-6 mr-3">
                                    <input type="checkbox" class="checkbox-custom absolute opacity-0 w-full h-full cursor-pointer" 
                                        ${isParentCompleted ? 'checked' : ''} 
                                        onchange="toggleRecord('${parent.id}', '${dateStr}')">
                                    <div class="w-5 h-5 rounded border-2 border-slate-300 flex items-center justify-center transition-colors">
                                        <svg class="w-3 h-3 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                    </div>
                                </div>
                                <span class="${textClass} font-semibold flex-1 transition-colors text-lg">${parent.name}</span>
                                ${hasSubs ? `<button type="button" onclick="event.preventDefault(); toggleExpand('${parent.id}')" class="p-2 text-slate-400 hover:text-slate-600 focus:outline-none"><i class="fas fa-chevron-${parent.isExpanded ? 'up' : 'down'}"></i></button>` : ''}
                            </label>
                    `;

                    // Parent 완료 시 체인 습관(하위 습관) 빠른 추가 입력창 표시
                    if (isParentCompleted) {
                        html += `
                            <div class="px-4 py-3 bg-blue-50/50 border-t border-blue-100 flex items-center gap-2 animate-[fadeIn_0.3s_ease-out]">
                                <i class="fas fa-link text-blue-400 text-sm"></i>
                                <input type="text" id="chain-sub-${parent.id}" placeholder="이어서 할 하위 습관 추가..." class="flex-1 px-3 py-1.5 text-[15px] rounded border border-blue-200 focus:outline-none focus:border-blue-500 bg-white" onkeypress="if(event.key==='Enter') addSubHabit('${parent.id}', 'chain-sub-${parent.id}')">
                                <button onclick="addSubHabit('${parent.id}', 'chain-sub-${parent.id}')" class="px-3 py-1.5 text-[15px] bg-blue-500 hover:bg-blue-600 text-white rounded font-medium transition">추가</button>
                            </div>
                        `;
                    }

                    // Render Sub Habits (Font size increased to text-base)
                    if (hasSubs && parent.isExpanded) {
                        html += `<div class="bg-slate-50/50 border-t border-slate-100 py-1">`;
                        parent.subHabits.forEach(sub => {
                            const isSubCompleted = completedIds.includes(sub.id);
                            const subTextClass = isSubCompleted ? 'text-slate-400 line-through' : 'text-slate-700';
                            
                            html += `
                                <label class="flex items-center p-2.5 pl-12 cursor-pointer hover:bg-slate-100/50 select-none group">
                                    <div class="relative flex items-center justify-center w-5 h-5 mr-3">
                                        <input type="checkbox" class="checkbox-custom absolute opacity-0 w-full h-full cursor-pointer" 
                                            ${isSubCompleted ? 'checked' : ''} 
                                            onchange="toggleRecord('${sub.id}', '${dateStr}')">
                                        <div class="w-4 h-4 rounded-sm border-2 border-slate-300 flex items-center justify-center transition-colors">
                                            <svg class="w-2.5 h-2.5 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                        </div>
                                    </div>
                                    <!-- 하위 습관 폰트 크기를 text-base로 조정 -->
                                    <span class="${subTextClass} text-base transition-colors flex-1">${sub.name}</span>
                                </label>
                            `;
                        });
                        html += `</div>`;
                    }

                    html += `</div>`;
                });

                html += `</div>`;
                section.innerHTML = html;
                container.appendChild(section);
            });
        }

        // Initialize on load
        window.onload = init;

    </script>
</body>
</html>
