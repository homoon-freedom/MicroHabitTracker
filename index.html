<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작은 습관 트래커</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .calendar-day:hover:not(.empty) {
            background-color: #e2e8f0;
        }

        .calendar-day.selected {
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
        }

        .calendar-day.today {
            border: 2px solid #3b82f6;
        }

        .progress-bar {
            position: absolute;
            bottom: 4px;
            left: 10%;
            width: 80%;
            height: 4px;
            border-radius: 2px;
            background-color: #e2e8f0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #10b981;
            transition: width 0.3s ease;
        }
        
        .selected .progress-bar {
            background-color: rgba(255,255,255,0.3);
        }
        .selected .progress-fill {
            background-color: #fff;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .checkbox-custom:checked + div {
            background-color: #10b981;
            border-color: #10b981;
        }
        .checkbox-custom:checked + div svg {
            opacity: 1;
        }
        
        .sub-habit-indent {
            position: relative;
        }
        .sub-habit-indent::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #e2e8f0;
        }
        .sub-habit-indent::after {
            content: '';
            position: absolute;
            left: -14px;
            top: 50%;
            width: 10px;
            height: 2px;
            background-color: #e2e8f0;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen p-4 md:p-8">

    <div class="max-w-[1400px] mx-auto">
        <header class="mb-8 text-center md:text-left flex flex-col md:flex-row md:items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight"><i class="fas fa-layer-group text-blue-500 mr-2"></i>계층형 작은 습관 트래커</h1>
                <p class="text-slate-500 mt-2">상하위 습관 관리, 연속 달성일, 그룹별 진척도</p>
            </div>
            <div class="mt-4 md:mt-0 px-4 py-2 bg-white rounded-full shadow-sm border border-slate-200 inline-flex items-center gap-2">
                <i class="far fa-calendar-check text-blue-500"></i>
                <span id="today-display" class="font-medium text-slate-700"></span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- 달력 영역 -->
            <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[750px]">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-semibold text-slate-800" id="current-month-year"></h2>
                    <div class="flex gap-2">
                        <button onclick="changeMonth(-1)" class="p-2 rounded-full hover:bg-slate-100 transition text-slate-600"><i class="fas fa-chevron-left"></i></button>
                        <button onclick="goToToday()" class="px-3 py-1 text-sm rounded-full bg-slate-100 hover:bg-slate-200 transition text-slate-700 font-medium">오늘</button>
                        <button onclick="changeMonth(1)" class="p-2 rounded-full hover:bg-slate-100 transition text-slate-600"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="calendar-grid mb-2">
                    <div class="text-center text-xs font-semibold text-red-400">일</div>
                    <div class="text-center text-xs font-semibold text-slate-500">월</div>
                    <div class="text-center text-xs font-semibold text-slate-500">화</div>
                    <div class="text-center text-xs font-semibold text-slate-500">수</div>
                    <div class="text-center text-xs font-semibold text-slate-500">목</div>
                    <div class="text-center text-xs font-semibold text-slate-500">금</div>
                    <div class="text-center text-xs font-semibold text-blue-400">토</div>
                </div>
                <div id="calendar-days" class="calendar-grid flex-1"></div>
            </div>

            <!-- 일일 실행 영역 -->
            <div class="lg:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[750px] overflow-hidden">
                <div class="p-6 bg-slate-50 border-b border-slate-100">
                    <h2 class="text-xl font-semibold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-tasks text-blue-500"></i>
                        <span id="selected-date-title"></span>
                    </h2>
                    <div class="mt-2 w-full bg-slate-200 rounded-full h-2.5">
                        <div id="daily-total-progress" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                    <p class="text-sm text-slate-500 mt-1 text-right" id="daily-progress-text">0% 완료</p>
                </div>
                <div class="p-6 overflow-y-auto flex-1 bg-white" id="daily-habits-container">
                    <!-- Javascript 렌더링 -->
                </div>
            </div>

            <!-- 습관 관리 영역 -->
            <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[750px]">
                <h2 class="text-xl font-semibold text-slate-800 mb-6 flex items-center gap-2">
                    <i class="fas fa-cog text-slate-400"></i>습관 관리 및 추가
                </h2>
                
                <!-- 새 최상위 습관 추가 -->
                <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <input type="text" id="new-habit-name" placeholder="최상위 습관 이름 (예: 기상 후 루틴)" class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3 text-sm">
                    <div class="flex gap-2 mb-2">
                        <select id="new-habit-time-select" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white" onchange="toggleCustomTimeInput()">
                            <option value="아침">🌅 아침</option>
                            <option value="점심">☀️ 점심</option>
                            <option value="저녁">🌙 저녁</option>
                            <option value="자기전">💤 자기전</option>
                            <option value="수시">🔄 수시</option>
                            <option value="custom">직접 입력...</option>
                        </select>
                        <input type="text" id="new-habit-time-custom" placeholder="시간대 입력" class="hidden flex-1 px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                    <button onclick="addTopHabit()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition text-sm font-medium">
                        최상위 습관 추가
                    </button>
                </div>

                <!-- 전체 습관 목록 관리 -->
                <div class="flex-1 overflow-y-auto pr-2">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">전체 습관 목록</h3>
                    <div id="managed-habits-list" class="space-y-4">
                        <!-- Javascript 렌더링 -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- 데이터 구조 ---
        // habits: [{ id, name, time, createdAt, isExpanded, subHabits: [{ id, name, createdAt }] }]
        let habits = JSON.parse(localStorage.getItem('microHabitsData')) || [];
        // records: { "YYYY-MM-DD": ["habit_id_1", "sub_id_1"] }
        let records = JSON.parse(localStorage.getItem('microHabitsRecords')) || {};
        
        let currentMonthDate = new Date();
        let selectedDate = new Date();

        // 날짜 유틸리티
        function formatDateToYYYYMMDD(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }
        function formatDisplayDate(date) {
            return date.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
        }
        function generateId() { return Math.random().toString(36).substr(2, 9); }
        function saveData() {
            localStorage.setItem('microHabitsData', JSON.stringify(habits));
            localStorage.setItem('microHabitsRecords', JSON.stringify(records));
        }

        // 초기화
        function init() {
            document.getElementById('today-display').innerText = formatDisplayDate(new Date());
            renderAll();
        }

        function renderAll() {
            renderCalendar();
            renderManageView();
            renderDailyView();
        }

        // --- 기능: 연속 달성일(Streak) 계산 ---
        function calculateStreak(habitId, baseDate) {
            let streak = 0;
            let current = new Date(baseDate);
            
            // 오늘(선택일) 체크
            let dStr = formatDateToYYYYMMDD(current);
            let isDoneToday = records[dStr] && records[dStr].includes(habitId);
            
            if (!isDoneToday) {
                // 오늘 안했으면 어제 했는지 확인. 어제도 안했으면 0.
                current.setDate(current.getDate() - 1);
                dStr = formatDateToYYYYMMDD(current);
                if (!records[dStr] || !records[dStr].includes(habitId)) {
                    return 0;
                }
            }
            
            // 어제 또는 오늘부터 과거로 연속 카운트
            while (true) {
                let checkStr = formatDateToYYYYMMDD(current);
                if (records[checkStr] && records[checkStr].includes(habitId)) {
                    streak++;
                    current.setDate(current.getDate() - 1);
                } else {
                    break;
                }
            }
            return streak;
        }

        // --- 기능: 최상위/하위 습관 관리 ---
        function toggleCustomTimeInput() {
            const select = document.getElementById('new-habit-time-select');
            const customInput = document.getElementById('new-habit-time-custom');
            if (select.value === 'custom') {
                select.classList.add('hidden');
                customInput.classList.remove('hidden');
                customInput.focus();
            }
        }

        function addTopHabit() {
            const name = document.getElementById('new-habit-name').value.trim();
            const select = document.getElementById('new-habit-time-select');
            let time = select.value;
            if (time === 'custom') {
                time = document.getElementById('new-habit-time-custom').value.trim();
                if (!time) time = '기타';
            }

            if (!name) return;

            habits.push({
                id: 'top_' + generateId(),
                name: name,
                time: time,
                createdAt: formatDateToYYYYMMDD(new Date()),
                isExpanded: true,
                subHabits: []
            });

            document.getElementById('new-habit-name').value = '';
            document.getElementById('new-habit-time-select').value = '아침';
            document.getElementById('new-habit-time-select').classList.remove('hidden');
            document.getElementById('new-habit-time-custom').classList.add('hidden');
            document.getElementById('new-habit-time-custom').value = '';

            saveData();
            renderAll();
        }

        function addSubHabit(parentId, inputId = null) {
            let name = "";
            if (inputId) {
                const inputEl = document.getElementById(inputId);
                name = inputEl.value.trim();
                inputEl.value = "";
            } else {
                name = prompt("하위 습관 이름을 입력하세요:");
            }
            
            if (!name) return;

            const parent = habits.find(h => h.id === parentId);
            if (parent) {
                parent.subHabits.push({
                    id: 'sub_' + generateId(),
                    name: name,
                    createdAt: formatDateToYYYYMMDD(new Date())
                });
                parent.isExpanded = true;
                saveData();
                renderAll();
            }
        }

        function deleteHabit(id, parentId = null) {
            if (!confirm("정말 삭제하시겠습니까? 관련 기록도 함께 지워집니다.")) return;

            if (parentId) {
                const parent = habits.find(h => h.id === parentId);
                if (parent) {
                    parent.subHabits = parent.subHabits.filter(s => s.id !== id);
                }
            } else {
                habits = habits.filter(h => h.id !== id);
            }
            saveData();
            renderAll();
        }

        function editHabitName(id, parentId = null) {
            const newName = prompt("새로운 이름을 입력하세요:");
            if (!newName) return;

            if (parentId) {
                const parent = habits.find(h => h.id === parentId);
                if (parent) {
                    const sub = parent.subHabits.find(s => s.id === id);
                    if (sub) sub.name = newName;
                }
            } else {
                const habit = habits.find(h => h.id === id);
                if (habit) habit.name = newName;
            }
            saveData();
            renderAll();
        }

        function moveSubHabit(parentId, index, direction) {
            const parent = habits.find(h => h.id === parentId);
            if (!parent) return;
            
            if (direction === -1 && index > 0) {
                const temp = parent.subHabits[index];
                parent.subHabits[index] = parent.subHabits[index - 1];
                parent.subHabits[index - 1] = temp;
            } else if (direction === 1 && index < parent.subHabits.length - 1) {
                const temp = parent.subHabits[index];
                parent.subHabits[index] = parent.subHabits[index + 1];
                parent.subHabits[index + 1] = temp;
            }
            saveData();
            renderManageView();
            renderDailyView();
        }

        function toggleExpand(id) {
            const habit = habits.find(h => h.id === id);
            if (habit) {
                habit.isExpanded = !habit.isExpanded;
                saveData();
                renderManageView();
                renderDailyView();
            }
        }

        function toggleCompletion(id, dateStr) {
            if (!records[dateStr]) records[dateStr] = [];
            const idx = records[dateStr].indexOf(id);
            if (idx > -1) {
                records[dateStr].splice(idx, 1);
            } else {
                records[dateStr].push(id);
            }
            saveData();
            renderAll();
        }

        // --- 렌더링: 관리 뷰 ---
        function renderManageView() {
            const container = document.getElementById('managed-habits-list');
            container.innerHTML = '';

            habits.forEach(parent => {
                const parentEl = document.createElement('div');
                parentEl.className = 'bg-white border border-slate-200 rounded-xl overflow-hidden';
                
                // Parent Header
                parentEl.innerHTML = `
                    <div class="p-3 bg-slate-50 flex items-center justify-between border-b border-slate-100">
                        <div class="flex items-center gap-2">
                            <button onclick="toggleExpand('${parent.id}')" class="text-slate-400 hover:text-slate-600 w-5">
                                <i class="fas ${parent.isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'} text-sm"></i>
                            </button>
                            <span class="text-xs font-bold px-2 py-1 bg-slate-200 text-slate-600 rounded">${parent.time}</span>
                            <span class="font-semibold text-slate-800">${parent.name}</span>
                            <span class="text-[10px] text-slate-400 ml-2 bg-white px-1 border rounded">시작일: ${parent.createdAt}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="editHabitName('${parent.id}')" class="p-1.5 text-slate-400 hover:text-blue-500 rounded"><i class="fas fa-pen text-xs"></i></button>
                            <button onclick="addSubHabit('${parent.id}')" class="p-1.5 text-slate-400 hover:text-green-500 rounded" title="하위 습관 추가"><i class="fas fa-plus text-xs"></i></button>
                            <button onclick="deleteHabit('${parent.id}')" class="p-1.5 text-slate-400 hover:text-red-500 rounded"><i class="fas fa-trash text-xs"></i></button>
                        </div>
                    </div>
                `;

                // Sub Habits
                if (parent.isExpanded && parent.subHabits.length > 0) {
                    const subContainer = document.createElement('div');
                    subContainer.className = 'p-2 space-y-1 bg-white';
                    
                    parent.subHabits.forEach((sub, idx) => {
                        subContainer.innerHTML += `
                            <div class="flex items-center justify-between p-2 pl-8 hover:bg-slate-50 rounded-lg group">
                                <div class="flex items-center gap-2">
                                    <i class="fas fa-level-up-alt rotate-90 text-slate-300 text-xs"></i>
                                    <span class="text-base text-slate-700">${sub.name}</span>
                                    <span class="text-[10px] text-slate-300 opacity-0 group-hover:opacity-100 transition">시작: ${sub.createdAt}</span>
                                </div>
                                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                                    <button onclick="moveSubHabit('${parent.id}', ${idx}, -1)" class="p-1 text-slate-400 hover:text-blue-500"><i class="fas fa-arrow-up text-xs"></i></button>
                                    <button onclick="moveSubHabit('${parent.id}', ${idx}, 1)" class="p-1 text-slate-400 hover:text-blue-500"><i class="fas fa-arrow-down text-xs"></i></button>
                                    <button onclick="editHabitName('${sub.id}', '${parent.id}')" class="p-1 text-slate-400 hover:text-blue-500"><i class="fas fa-pen text-xs"></i></button>
                                    <button onclick="deleteHabit('${sub.id}', '${parent.id}')" class="p-1 text-slate-400 hover:text-red-500"><i class="fas fa-trash text-xs"></i></button>
                                </div>
                            </div>
                        `;
                    });
                    parentEl.appendChild(subContainer);
                }
                container.appendChild(parentEl);
            });
        }

        // --- 렌더링: 일일 뷰 ---
        function renderDailyView() {
            const dateStr = formatDateToYYYYMMDD(selectedDate);
            document.getElementById('selected-date-title').innerText = formatDisplayDate(selectedDate);
            
            const container = document.getElementById('daily-habits-container');
            container.innerHTML = '';

            if (habits.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 mt-10"><i class="fas fa-clipboard-list text-4xl mb-3 opacity-50"></i><p>등록된 습관이 없습니다.</p></div>';
                document.getElementById('daily-total-progress').style.width = '0%';
                document.getElementById('daily-progress-text').innerText = '0% 완료';
                return;
            }

            // 그룹핑 (시간대별)
            const grouped = {};
            habits.forEach(h => {
                if (!grouped[h.time]) grouped[h.time] = [];
                grouped[h.time].push(h);
            });

            let totalItems = 0;
            let totalCompleted = 0;

            Object.keys(grouped).forEach(time => {
                const section = document.createElement('div');
                section.className = 'mb-6';
                section.innerHTML = `<h3 class="text-sm font-bold text-slate-700 mb-3 px-1">${time}</h3>`;
                
                const list = document.createElement('div');
                list.className = 'space-y-3';

                grouped[time].forEach(parent => {
                    // 계산
                    const parentCompleted = records[dateStr] && records[dateStr].includes(parent.id);
                    let groupTotalCount = 1 + parent.subHabits.length;
                    let groupCompletedCount = parentCompleted ? 1 : 0;
                    
                    parent.subHabits.forEach(sub => {
                        if (records[dateStr] && records[dateStr].includes(sub.id)) groupCompletedCount++;
                    });

                    totalItems += groupTotalCount;
                    totalCompleted += groupCompletedCount;

                    const parentStreak = calculateStreak(parent.id, selectedDate);
                    const groupProgressPercent = Math.round((groupCompletedCount / groupTotalCount) * 100);
                    
                    const parentItem = document.createElement('div');
                    parentItem.className = 'bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm';
                    
                    // 최상위 습관 UI
                    let parentHtml = `
                        <div class="p-3 ${parentCompleted ? 'bg-green-50' : 'bg-white'} transition-colors flex flex-col gap-2">
                            <div class="flex items-center justify-between">
                                <label class="flex items-center gap-3 cursor-pointer flex-1 group">
                                    <div class="relative flex items-center justify-center w-6 h-6">
                                        <input type="checkbox" class="checkbox-custom absolute opacity-0 w-full h-full cursor-pointer" 
                                            ${parentCompleted ? 'checked' : ''} 
                                            onchange="toggleCompletion('${parent.id}', '${dateStr}')">
                                        <div class="w-5 h-5 rounded border-2 ${parentCompleted ? 'border-green-500 bg-green-500' : 'border-slate-300'} flex items-center justify-center">
                                            <svg class="w-3 h-3 text-white ${parentCompleted ? 'opacity-100' : 'opacity-0'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                        </div>
                                    </div>
                                    <span class="font-semibold text-slate-800 ${parentCompleted ? 'line-through text-slate-500' : ''}">${parent.name}</span>
                                    ${parentStreak > 1 ? `<span class="text-xs text-orange-500 font-bold bg-orange-50 px-2 py-0.5 rounded-full ml-2">🔥 ${parentStreak}일 연속</span>` : ''}
                                </label>
                                
                                <div class="flex items-center gap-3">
                                    <div class="flex flex-col items-end">
                                        <span class="text-[10px] font-bold ${groupProgressPercent === 100 ? 'text-green-500' : 'text-blue-500'}">${groupProgressPercent}%</span>
                                        <div class="w-12 h-1.5 bg-slate-200 rounded-full mt-0.5">
                                            <div class="h-full rounded-full ${groupProgressPercent === 100 ? 'bg-green-500' : 'bg-blue-500'}" style="width: ${groupProgressPercent}%"></div>
                                        </div>
                                    </div>
                                    ${parent.subHabits.length > 0 ? `
                                        <button onclick="toggleExpand('${parent.id}')" class="p-1 text-slate-400 hover:text-slate-700 bg-slate-100 rounded">
                                            <i class="fas ${parent.isExpanded ? 'fa-chevron-up' : 'fa-chevron-down'} text-xs"></i>
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;

                    // 하위 습관 UI
                    if (parent.isExpanded && parent.subHabits.length > 0) {
                        parentHtml += `<div class="bg-slate-50 border-t border-slate-100 p-2 space-y-1 pl-10">`;
                        parent.subHabits.forEach(sub => {
                            const subCompleted = records[dateStr] && records[dateStr].includes(sub.id);
                            const subStreak = calculateStreak(sub.id, selectedDate);
                            
                            parentHtml += `
                                <div class="flex items-center py-1 sub-habit-indent">
                                    <label class="flex items-center gap-3 cursor-pointer flex-1 group">
                                        <div class="relative flex items-center justify-center w-5 h-5">
                                            <input type="checkbox" class="checkbox-custom absolute opacity-0 w-full h-full cursor-pointer" 
                                                ${subCompleted ? 'checked' : ''} 
                                                onchange="toggleCompletion('${sub.id}', '${dateStr}')">
                                            <div class="w-4 h-4 rounded border-2 ${subCompleted ? 'border-green-500 bg-green-500' : 'border-slate-300'} flex items-center justify-center">
                                                <svg class="w-2.5 h-2.5 text-white ${subCompleted ? 'opacity-100' : 'opacity-0'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                            </div>
                                        </div>
                                        <span class="text-base text-slate-700 ${subCompleted ? 'line-through text-slate-400' : ''}">${sub.name}</span>
                                        ${subStreak > 1 ? `<span class="text-[10px] text-orange-500 font-bold ml-2">🔥 ${subStreak}일</span>` : ''}
                                    </label>
                                </div>
                            `;
                        });
                        parentHtml += `</div>`;
                    }

                    // 체인 습관 입력창 (최상위 습관 완료 시 표시)
                    if (parentCompleted && parent.isExpanded) {
                        parentHtml += `
                            <div class="bg-slate-50 p-2 pl-10 border-t border-slate-100 flex items-center gap-2">
                                <i class="fas fa-link text-slate-300 text-xs"></i>
                                <input type="text" id="chain-input-${parent.id}" placeholder="이어서 할 하위 습관 추가 (Enter)" 
                                    class="text-sm bg-white border border-slate-200 rounded px-2 py-1 w-full focus:outline-none focus:border-blue-400"
                                    onkeydown="if(event.key === 'Enter') addSubHabit('${parent.id}', 'chain-input-${parent.id}')">
                            </div>
                        `;
                    }

                    parentItem.innerHTML = parentHtml;
                    list.appendChild(parentItem);
                });
                
                section.appendChild(list);
                container.appendChild(section);
            });

            // 전체 진척도 업데이트
            const totalPercent = totalItems === 0 ? 0 : Math.round((totalCompleted / totalItems) * 100);
            document.getElementById('daily-total-progress').style.width = `${totalPercent}%`;
            document.getElementById('daily-progress-text').innerText = `${totalPercent}% 완료 (${totalCompleted}/${totalItems})`;
        }

        // --- 렌더링: 달력 ---
        function changeMonth(delta) {
            currentMonthDate.setMonth(currentMonthDate.getMonth() + delta);
            renderAll();
        }

        function goToToday() {
            currentMonthDate = new Date();
            selectedDate = new Date();
            renderAll();
        }

        function getDailyTotalProgress(dateStr) {
            let total = 0;
            let completed = 0;
            habits.forEach(parent => {
                total++;
                if (records[dateStr] && records[dateStr].includes(parent.id)) completed++;
                parent.subHabits.forEach(sub => {
                    total++;
                    if (records[dateStr] && records[dateStr].includes(sub.id)) completed++;
                });
            });
            return total === 0 ? 0 : Math.round((completed / total) * 100);
        }

        function renderCalendar() {
            const year = currentMonthDate.getFullYear();
            const month = currentMonthDate.getMonth();
            
            document.getElementById('current-month-year').innerText = `${year}년 ${month + 1}월`;
            
            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            const todayStr = formatDateToYYYYMMDD(new Date());
            const selectedStr = formatDateToYYYYMMDD(selectedDate);

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-day empty';
                daysContainer.appendChild(emptyDiv);
            }

            for (let i = 1; i <= lastDay; i++) {
                const dateObj = new Date(year, month, i);
                const dateStr = formatDateToYYYYMMDD(dateObj);
                const progress = getDailyTotalProgress(dateStr);
                
                const dayDiv = document.createElement('div');
                dayDiv.className = `calendar-day text-sm bg-slate-50 border border-slate-100/50`;
                
                if (dateStr === todayStr) dayDiv.classList.add('today');
                if (dateStr === selectedStr) dayDiv.classList.add('selected');
                
                const dayOfWeek = dateObj.getDay();
                let textClass = "text-slate-700";
                if(dayDiv.classList.contains('selected')) textClass = "text-white";
                else {
                    if(dayOfWeek === 0) textClass = "text-red-500";
                    if(dayOfWeek === 6) textClass = "text-blue-500";
                }

                let progressBarHtml = '';
                if (habits.length > 0) {
                    let fillColor = progress === 100 ? '#10b981' : (progress > 0 ? '#3b82f6' : 'transparent');
                    if (dayDiv.classList.contains('selected') && progress > 0) fillColor = '#ffffff';
                    progressBarHtml = `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%; background-color: ${fillColor}"></div>
                        </div>
                    `;
                }

                dayDiv.innerHTML = `<span class="${textClass} font-medium relative z-10">${i}</span>${progressBarHtml}`;
                dayDiv.onclick = () => {
                    selectedDate = new Date(year, month, i);
                    renderAll();
                };
                daysContainer.appendChild(dayDiv);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
